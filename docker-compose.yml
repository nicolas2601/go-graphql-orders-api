services:
  api:
    build: .
    environment:
      APP_ENV: development # habilita el playground para la demo; en produccion se pone production
      PORT: "8080"
      LOG_LEVEL: info
      DATABASE_URL: postgres://orders:${POSTGRES_PASSWORD:-orders}@db:5432/orders?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-please}
      SEED_PRODUCTS: "true"
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: orders
      POSTGRES_USER: orders
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-orders}
    # Sin puerto publicado al host: la base solo es accesible desde la red interna de compose.
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orders -d orders"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
